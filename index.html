<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MyCraft</title>
    <!-- Using example styles for basic structure, might remove later -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/three@0.166.1/examples/css/main.css">
    <style>
        body { margin: 0; overflow: hidden; background-color: #000; cursor: pointer; }
        canvas { display: block; }
        #block-selector {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.5);
            padding: 5px;
            display: none; /* Start hidden, show on pointer lock */
            gap: 5px;
            border-radius: 5px;
            z-index: 10;
        }
        .block-option {
            width: 40px;
            height: 40px;
            border: 2px solid white;
            cursor: pointer;
            box-sizing: border-box;
            background-size: cover; /* Just in case we add texture previews later */
            image-rendering: pixelated; /* Keep block previews sharp if textures used */
        }
        .block-option.selected {
            border-color: yellow;
            transform: scale(1.1);
            box-shadow: 0 0 5px yellow;
        }
        #loading {
            position: absolute;
            top: 10px; /* Move to top */
            left: 50%;
            transform: translateX(-50%);
            color: white;
            font-size: 1.2em; /* Slightly smaller */
            text-align: center;
            background-color: rgba(0, 0, 0, 0.7);
            padding: 5px 15px; /* Smaller padding */
            border-radius: 8px;
            z-index: 20;
            display: none; /* Start hidden */
        }
        .crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 4px; /* Slightly thicker */
            height: 4px; /* Square dot */
            background-color: rgba(255, 255, 255, 0.7); /* Semi-transparent white */
            border-radius: 50%; /* Make it a circle/dot */
            transform: translate(-50%, -50%);
            pointer-events: none;
            z-index: 10;
        }
        /* Instructions Text */
        #instructions {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-size: 1.5em;
            text-align: center;
            background-color: rgba(0, 0, 0, 0.6);
            padding: 20px;
            border-radius: 10px;
            z-index: 15; /* Below loading, above crosshair/selector */
            display: block; /* Initially visible */
             pointer-events: none; /* Don't block clicks */
        }
    </style>
</head>
<body>
    <div id="instructions">Click to Play</div>
    <div id="loading">Loading...</div>
    <div class="crosshair"></div>
    <div id="block-selector"></div>

    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.166.1/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.166.1/examples/jsm/",
            "websim": "/websim/websim.js",
            "simplex-noise": "https://cdn.jsdelivr.net/npm/simplex-noise@4.0.1/+esm"
        }
    }
    </script>
    <script type="module" src="main.js"></script>
