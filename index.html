<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MyCraft</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/three@0.166.1/examples/css/main.css">
    <style>
        body { margin: 0; overflow: hidden; background-color: #000; /* Fallback background */ }
        canvas { display: block; }
        #block-selector {
            position: absolute;
            bottom: 20px; /* Increased bottom margin */
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.5);
            padding: 5px;
            display: flex;
            gap: 5px;
            border-radius: 5px; /* Rounded corners */
            z-index: 10; /* Ensure it's above canvas */
        }
        .block-option {
            width: 40px;
            height: 40px;
            border: 2px solid white;
            cursor: pointer;
            box-sizing: border-box; /* Include border in size */
            /* Removed texture background properties */
        }
        .block-option.selected {
            border-color: yellow;
            transform: scale(1.1); /* Make selected slightly larger */
            box-shadow: 0 0 5px yellow;
        }
        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-size: 2em;
            text-align: center;
            background-color: rgba(0, 0, 0, 0.7); /* Semi-transparent background */
            padding: 10px 20px;
            border-radius: 8px;
            z-index: 20; /* Ensure loading is on top */
            display: none; /* Start hidden */
        }
        .crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 2px; /* Thinner crosshair */
            height: 10px;
            background-color: white;
            transform: translate(-50%, -50%);
            pointer-events: none; /* Don't interfere with clicks */
            z-index: 10;
        }
        .crosshair::before { /* Horizontal line */
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 10px;
            height: 2px;
            background-color: white;
            transform: translate(-50%, -50%);
        }
    </style>
</head>
<body>
    <!-- Elements order matters less with absolute positioning, but keep logical -->
    <div id="loading">Loading...</div>
    <div class="crosshair"></div>
    <div id="block-selector"></div>

    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.166.1/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.166.1/examples/jsm/",
            "websim": "/websim/websim.js",
            "simplex-noise": "https://cdn.jsdelivr.net/npm/simplex-noise@4.0.1/+esm"
        }
    }
    </script>
    <!-- Ensure main.js is loaded last -->
    <script type="module" src="main.js"></script>
